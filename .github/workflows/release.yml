# Build macOS app + updater artifacts and publish a GitHub Release.
# Trigger: git tag v* (e.g. v0.1.1)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.tauri"
          printf '%s' "$SIGNING_KEY" > "$HOME/.tauri/freelance-timer.key"
          echo "SIGNING_KEY_PATH=$HOME/.tauri/freelance-timer.key" >> "$GITHUB_ENV"

      - name: Build Tauri app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SIGNING_KEY_PATH: ${{ env.SIGNING_KEY_PATH }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY_PATH"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$SIGNING_KEY_PATH"
          npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Generate latest.json
        env:
          VERSION: ${{ github.ref_name }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUNDLE_DIR: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: node scripts/generate-latest-json.mjs

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Freelance Timer ${{ github.ref_name }}
          body: macOS (Apple Silicon) build with in-app auto-update.
          draft: false
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Freelance Timer.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Freelance Timer.app.tar.gz.sig
            latest.json
